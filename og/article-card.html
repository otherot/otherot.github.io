<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Article Card</title>
<style>
html,body{margin:0;padding:0}
body{
  box-sizing:border-box;
  width:1200px;
  height:630px;
  overflow:hidden;
  background:#0d1b2a;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:60px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.title{font-size:56px;font-weight:800;letter-spacing:-.01em;line-height:1.15;max-width:1080px}
.divider{width:100%;height:1px;background:rgba(93,202,165,.25);margin:36px 0 32px}
.metrics{display:flex;align-items:center;gap:16px;font-size:28px;font-weight:600;color:#e0e6ed;font-family:'SF Mono','Fira Code',monospace}
.metrics .sep{color:#5DCAA5}
.footer{display:flex;align-items:center;justify-content:space-between}
.author{font-size:24px;color:#e0e6ed;font-weight:600}
.url{font-family:'SF Mono','Fira Code',monospace;font-size:24px;color:#5DCAA5}
</style>
</head>
<body>

<div class="top">
  <div class="title">Migrating 300TB from ELK to OpenSearch with Zero Downtime</div>
  <div class="divider"></div>
  <div class="metrics"><span>300TB</span><span class="sep">·</span><span>40B docs/day</span><span class="sep">·</span><span>zero downtime</span></div>
</div>

<div class="footer">
  <div class="author">Anton Cherkasov</div>
  <div class="url">otherot.github.io</div>
</div>

</body>
</html>
