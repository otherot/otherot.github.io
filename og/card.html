<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Card</title>
<style>
html,body{margin:0;padding:0}
body{
  box-sizing:border-box;
  width:1200px;
  height:630px;
  overflow:hidden;
  background:#0d1b2a;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:60px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.name{font-size:76px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.title{font-size:34px;color:#8892a0;font-weight:600;margin-top:14px}
.divider{width:100%;height:1px;background:rgba(93,202,165,.25);margin:36px 0 32px}
.metrics{display:flex;flex-direction:column;gap:18px}
.metric{display:flex;align-items:center;font-size:32px;font-weight:600;color:#e0e6ed}
.metric .mark{width:14px;height:14px;background:#5DCAA5;margin-right:20px;flex-shrink:0}
.footer{display:flex;align-items:center;justify-content:space-between}
.url{font-family:'SF Mono','Fira Code',monospace;font-size:24px;color:#5DCAA5}
.stack{font-size:22px;color:#8892a0;font-family:'SF Mono','Fira Code',monospace}
</style>
</head>
<body>

<div class="top">
  <div class="name">Anton Cherkasov</div>
  <div class="title">Site Reliability Engineer &amp; Team Lead</div>
  <div class="divider"></div>
  <div class="metrics">
    <div class="metric"><span class="mark"></span>Reliability for 80M+ users at 99.95% SLA</div>
    <div class="metric"><span class="mark"></span>300TB ELK migration to OpenSearch, zero downtime</div>
    <div class="metric"><span class="mark"></span>MTTR from hours to under 10 minutes</div>
  </div>
</div>

<div class="footer">
  <div class="url">otherot.github.io</div>
  <div class="stack">Kubernetes · OpenShift · Terraform</div>
</div>

</body>
</html>
