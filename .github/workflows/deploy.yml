name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Allowlist of what gets published; everything else (og/, scripts/, node_modules, docs) stays out.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml icons images resume _site/

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server key is pinned to rrsync, so the destination path is relative to the site root.
      - name: Rsync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # --checksum: a fresh checkout has new mtimes, so compare content instead.
          rsync -rlvz --checksum --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            _site/ "deploy@${DEPLOY_HOST}:./"
